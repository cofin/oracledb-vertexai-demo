[project]
authors = [{ name = "Cody Fincher", email = "cody.fincher@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "litestar[cryptography,jinja,jwt,opentelemetry,structlog]",
    "litestar-granian[uvloop]",
    "litestar-mcp[a2a,google-genai,opentelemetry]>=0.15.0",
    "msgspec>=0.22.0",
    "sqlspec[litestar,mypyc,opentelemetry,oracledb,performance]>=0.69.0",
    "google-genai>=1.68.0",
    "tenacity>=9.0.0",
    "numpy",
    "python-dotenv",
    "dishka",
    "litestar-vite",
    "litestar-autowire[dishka,queues]>=0.2.0",
    "litestar-htmx>=0.5.0",
    "litestar-queues[sqlspec]>=0.12.0",
    "litestar-security>=0.6.0",
]
description = "Reference application for Oracle 26ai and Vertex AI integration."
keywords = ["litestar", "vertexai", "oracledb", "google"]
license = { text = "MIT" }
maintainers = [{ name = "Cody Fincher", email = "cody.fincher@gmail.com" }]
name = "app"
readme = "README.md"
requires-python = ">=3.12,<3.15"
version = "0.3.1"

[project.scripts]
coffee = "app.__main__:run_cli"


[tool.bumpversion]
allow_dirty = true
commit = false
commit_args = "--no-verify"
current_version = "0.3.1"
ignore_missing_files = false
ignore_missing_version = false
message = "chore(release): bump to `v{new_version}`"
parse = """(?x)
    (?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)
    (-(?P<pre>alpha|beta|rc)\\.(?P<pre_n>\\d+))?
"""
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = ["{major}.{minor}.{patch}", "{major}.{minor}.{patch}-{pre}.{pre_n}"]
sign_tags = false
tag = false
tag_message = "chore(release): v{new_version}"
tag_name = "v{new_version}"

[tool.bumpversion.parts.pre]
first_value = "stable"
optional_value = "stable"
values = ["alpha", "beta", "rc", "stable"]

[tool.bumpversion.parts.pre_n]
first_value = "1"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
replace = 'version = "{new_version}"'
search = 'version = "{current_version}"'

[[tool.bumpversion.files]]
filename = "src/resources/package.json"
replace = '"version": "{new_version}"'
search = '"version": "{current_version}"'

[[tool.bumpversion.files]]
filename = "src/resources/package-lock.json"
replace = """
  "name": "cymbal-coffee",
  "version": "{new_version}",
"""
search = """
  "name": "cymbal-coffee",
  "version": "{current_version}",
"""

[[tool.bumpversion.files]]
filename = "src/resources/package-lock.json"
replace = """
      "name": "cymbal-coffee",
      "version": "{new_version}",
"""
search = """
      "name": "cymbal-coffee",
      "version": "{current_version}",
"""

[[tool.bumpversion.files]]
filename = "src/app/__metadata__.py"
replace = '__version__ = "{new_version}"'
search = '__version__ = "{current_version}"'

[[tool.bumpversion.files]]
filename = "src/app/__metadata__.py"
regex = true
replace = '__package_date__ = "{utcnow:%Y-%m-%dT%H:%M:%SZ}"'
search = '__package_date__ = "[^"]+"'

[tool.sqlspec]
config = "app.config.db"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "nodeenv"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["src", "."]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
packages = ["src/app"]

[tool.hatch.build.targets.wheel]
artifacts = [
    "**/*.j2",
    "**/*.sql",
    "**/*.ini",
    "**/*.ico",
    "**/*.png",
    "**/*.svg",
    "**/*.css",
    "**/*.js",
    "**/*.html",
    "**/*.txt",
    "**/*.json",
]
packages = ["src/app"]

[dependency-groups]
build = ["bump-my-version"]
dev = [
    { include-group = "extras" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "build" },
    { include-group = "docs" },
    { include-group = "slides" },
]
docs = [
    "sphinx>=9.0.4,<10",
    "sphinx-immaterial>=0.13.0",
    "myst-parser>=4.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-autobuild>=2024.10",
    "sphinx-autodoc-typehints>=3.6.1",
    "sphinxcontrib-mermaid>=2.0.2",
    "linkify-it-py>=2.0",
]
extras = []
lint = [
    "mypy",
    "pre-commit",
    "pyright",
    "ruff",
    "slotscheck",
    "types-click",
    "types-cachetools",
    "types-python-dateutil",
    "types-requests",
    "types-psutil",
]
slides = ["pygments", "qrcode[pil]"]
test = [
    "aiofiles",
    "anyio",
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-sugar",
    "pytest-xdist",
]

[tool.ruff]

extend-exclude = [".agents"]
fix = true
line-length = 120
preview = true
src = ["src", "tools"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
preview = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "builtin-attribute-shadowing",    # flake8-builtins - class attribute {name} is shadowing a python builtin
    "stdlib-module-shadowing",    # flake8-builtins - module {name} shadows a Python standard-library module
    "function-call-in-default-argument",    # flake8-bugbear - do not perform function call in argument defaults (Litestar's Dependency/Parameter idiom)
    "set-attr-with-constant",    # flake8-bugbear - do not call setattr with a constant attribute value
    "undocumented-public-module",    # pydocstyle - missing docstring in public module
    "undocumented-public-class",    # pydocstyle - missing docstring in public class
    "undocumented-public-method",    # pydocstyle - missing docstring in public method
    "undocumented-public-function",    # pydocstyle - missing docstring in public function
    "undocumented-public-package",    # pydocstyle - missing docstring in public package
    "undocumented-magic-method",    # pydocstyle - missing docstring in magic method
    "undocumented-public-nested-class",    # pydocstyle - missing docstring in public nested class
    "undocumented-public-init",    # pydocstyle - missing docstring in __init__
    "blank-line-after-function",    # pydocstyle - no blank lines allowed after function docstring
    "missing-blank-line-after-summary",    # pydocstyle - 1 blank line required between summary line and description
    "missing-terminal-punctuation",    # pydocstyle - first line should end with a period, question mark, or exclamation point
    "DOC",     # pydoclint - docstring content policy is too noisy for this app gate
    "line-too-long",    # pydocstyle line too long, handled by black
    "redefined-loop-name", # pylint - for loop variable overwritten by assignment target
    "mutable-class-default",  # Ruff-specific rule - annotated with classvar
    "non-empty-init-module",  # Ruff-specific rule - __init__ module registry contracts are intentional
    "any-type",  # Dynamically typed expressions (Any)
    "FBT",     # Boolean trap
    "too-many-arguments", # too many arguments
    "PT",      # Pytest rules
    "TD",      # Todo rules
    "unused-function-argument",  # ignore for now; investigate
    "unused-method-argument",  # ignore for now; investigate
    "unused-class-method-argument",  # ignore for now; investigate
    "try-except-in-loop", # ignore for now; investigate
    "too-many-branches", # Too many branches
    "single-line-implicit-string-concatenation",  # Implicit string concatenation
    "missing-trailing-comma",  # Trailing comma
    "blanket-type-ignore",  # Blanket type ignore
    "future-rewritable-type-annotation",   # Future annotations
    "import-outside-top-level", # import should be at the top of the file
    "too-many-public-methods", # too many public methods
    "too-many-positional-arguments", # Too many positional arguments
    "import-private-name", # Import private name
    "bad-dunder-method-name", # Bad dunder method name
    "no-self-use", # No self use
    "error-suffix-on-exception-name",    # Keep established exception names stable in this demo app
    "blind-except",  # flake8-blind-except - resilient exception logging and fallbacks
    "TC",      # flake8-type-checking - runtime introspection for Litestar, Dishka, msgspec
    "unnecessary-dunder-call", # pylint - unnecessary dunder call
    "global-statement", # pylint - global statement in PEP 562 modules
    "invalid-function-name",    # pep8-naming - function name should be lowercase
    "private-member-access",  # flake8-self - private member access
]
select = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Treat Sphinx literalinclude anchor markers as recognized task tags so they
# aren't flagged as dead code by ERA001.
task-tags = ["TODO", "FIXME", "XXX", "docs"]

[tool.ruff.lint.flake8-copyright]
author = "Google LLC"
notice-rgx = '(?i)(?:Copyright|SPDX-FileCopyrightText:)\s+(?:Copyright\s+)?(?:\(C\)\s+)?\d{4}([-,]\s*\d{4})*'

[tool.ruff.lint.pydocstyle]

convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.lint.isort]
known-first-party = ["tests", "app", "config"]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.config".msg = "Inject config/services via Dishka; only composition roots and SQL query lookups may import app.config."
"app.lib.settings.get_settings".msg = "Inject typed settings via Dishka; only composition roots and CLI entrypoints may call get_settings()."
"google.adk".msg = "Use the native app.domain.ai runtime and litestar-mcp agent primitives instead of google.adk."
"litestar.Controller".msg = "Inherit from litestar_security.PublicController or SecureController instead of bare litestar.Controller."
"litestar.plugins.htmx".msg = "Import HTMX primitives from litestar_htmx instead of litestar.plugins.htmx."
"orjson".msg = "Use msgspec via app.utils.serialization instead of orjson."
"pydantic".msg = "Use msgspec.Struct instead of pydantic."
"pydantic.BaseModel".msg = "Use msgspec.Struct instead of pydantic.BaseModel."

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undocumented-public-package"]
"manage.py" = ["banned-api"]
"src/app/cli/**/*.py" = ["banned-api"]
"src/app/config.py" = ["banned-api"]
"src/app/db/utils.py" = ["banned-api"]
"src/app/domain/ai/runtime/_store.py" = ["banned-api"]
"src/app/domain/chat/services/_router.py" = ["banned-api"]
"src/app/domain/chat/services/_telemetry.py" = ["banned-api"]
"src/app/domain/products/services/_embedding.py" = ["banned-api"]
"src/app/domain/products/services/_products.py" = ["banned-api"]
"src/app/domain/products/services/_stores.py" = ["banned-api"]
"src/app/domain/system/services/_cache.py" = ["banned-api"]
"src/app/domain/system/services/_health.py" = ["banned-api"]
"src/app/server/**/*.py" = ["banned-api"]
"src/tests/*.py" = [
    "ANN",
    "ARG",
    "banned-api",
    "undocumented-public-function",
    "undocumented-public-package",
    "EM",
    "magic-value-comparison",
    "unspecified-encoding",
    "unused-async",
    "float-equality-comparison",
    "assert",
    "hardcoded-temp-file",
    "hardcoded-password-string",
    "hardcoded-password-func-arg",
    "hardcoded-password-default",
    "private-member-access",
    "TRY",
]
"src/tests/**/*.py" = [
    "ANN",
    "ARG",
    "banned-api",
    "undocumented-public-function",
    "undocumented-public-package",
    "EM",
    "magic-value-comparison",
    "unspecified-encoding",
    "unused-async",
    "float-equality-comparison",
    "assert",
    "hardcoded-temp-file",
    "hardcoded-password-string",
    "hardcoded-password-func-arg",
    "hardcoded-password-default",
    "private-member-access",
    "TRY",
]
"tools/*.py" = ["banned-api", "implicit-namespace-package", "commented-out-code", "invalid-module-name"]
"tools/**/*.*" = ["D", "ARG", "EM", "TRY", "G", "FBT", "banned-api", "implicit-namespace-package", "subprocess-without-shell-equals-true", "suspicious-subprocess-import", "too-many-statements"]

[tool.slotscheck]
strict-imports = false

[tool.codespell]
# `ans` is an intentional answer-variable name in tests. Directory exclusions
# live in the pre-commit hook `exclude` regex (codespell skip globs don't match
# the relative paths pre-commit passes); this `skip` only covers file types.
ignore-words-list = "alog,ans"
skip = "uv.lock,package-lock.json,*.gz,*.min.js,*.map"

[tool.mypy]
disallow_any_generics = false
exclude = '''(?x)(
^.venv/
)'''
plugins = []
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true


[[tool.mypy.overrides]]
disallow_untyped_decorators = false
module = ["app.domain.ai.mcp.*"]

[[tool.mypy.overrides]]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
module = ["tests.*", "tools.*"]

[tool.pytest.ini_options]
addopts = ["-ra"]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:google.*",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: marks tests as integration (require live Oracle 26ai)",
    "slow: marks tests as slow (integration/runtime checks)",
]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.pyright]
exclude = ["docs", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
extraPaths = ["src"]
include = ["src/app", "src/tests", "tools", "manage.py"]
pythonVersion = "3.12"
reportMissingImports = "information"
reportMissingTypeStubs = false
venv = ".venv"
venvPath = "."
